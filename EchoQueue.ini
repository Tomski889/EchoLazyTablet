; EchoQueue (read when Echo starts)
[queue]
; Key that queues a public Echo Arena match while Echo's window is focused (F1 to F24).
hotkey=F9

[private]
; PRIVATE MATCH creates the match on this server, trying these ports (match slots) in turn.
; Leave server empty to let the matchmaker choose.
server=80.64.218.95
ports=6792,6793,6794,6795,6796

[fade]
; After pressing FIND MATCH's join, PRIVATE MATCH or LOBBY: wait this long (milliseconds),
; then fade to black before moving.
delay_ms=1000

; [captured] is written by EchoQueue the first time you queue for a public Echo Arena
; match the normal way; the hotkey then sends exactly the same request.
