; EchoLazyTablet (read when Echo starts)
[queue]
; Key that queues a public Echo Arena match while Echo's window is focused (F1 to F24).
hotkey=F9

[private]
; PRIVATE MATCH creates the match on the game server with your lowest ping (EchoVRCE's
; matchmaker picks it from the pings Echo measures to every server).
; To always use one server instead: use_server=1, its address in server, and its ports
; (match slots), tried in turn.
use_server=0
server=
ports=6792,6793,6794,6795,6796

[clip]
; What the tablet's CLIP button presses: your clip recorder's hotkey (Medal: ctrl+t). Set it on the
; tablet (PLAY page, KEY; asked the first time), or here: modifiers ctrl / shift / alt / win, then
; one key: a letter, a digit, F1 to F24, numpad0 to numpad9, or space, enter, tab, home, end, insert,
; delete, pageup, pagedown, printscreen, pause. For example: keys=ctrl+t (keys=none: no clip app)

[clock]
; The clock in the tablet's title strip: 24 (14:05) or 12 (2:05 PM). The 12H / 24H button next
; to it switches it.
format=24

[audio]
; When Echo closes, make this the sound output again (VR puts it on the headset): its name as in
; Windows' sound list, e.g. after_echo=Speakers (High Definition Audio Device). Empty: left alone.
after_echo=

[fade]
; After pressing FIND MATCH's join, PRIVATE MATCH or LOBBY: wait this long (milliseconds),
; then fade to black before moving.
delay_ms=1000

; [captured] is written by EchoLazyTablet the first time you queue for a public Echo Arena
; match the normal way; the hotkey then sends exactly the same request.
